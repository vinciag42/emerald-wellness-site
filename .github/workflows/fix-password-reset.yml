name: Fix password reset redirect

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/fix-password-reset.yml"

permissions:
  contents: write

jobs:
  fix-password-reset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Point password resets to the permanent Emerald Wellness login
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("login.html")
          content = path.read_text(encoding="utf-8")
          old = 'redirectTo: window.location.origin + "/login"'
          new = 'redirectTo: "https://emeraldwellness.health/login"'

          if old not in content:
              raise SystemExit("Expected password-reset redirect was not found; no file was changed.")

          path.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit the correction
        shell: bash
        run: |
          git config user.name "Emerald Wellness Automation"
          git config user.email "info@emeraldwellness.health"
          git add login.html
          git commit -m "Fix password reset redirect to Emerald Wellness"
          git push origin master
