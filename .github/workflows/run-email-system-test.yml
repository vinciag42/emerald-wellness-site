name: Run Emerald Email System Test

on:
  push:
    paths:
      - '.github/workflows/run-email-system-test.yml'

permissions:
  contents: write

jobs:
  test-email-system:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Wait for Vercel deployment
        run: sleep 120
      - name: Trigger secured branded email test
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 90 \
            'https://emeraldwellness.health/api/run-email-system-test?key=ew-email-test-20260726-d2a91f6c' \
            | tee email-test-result.json
      - name: Save result to repository
        if: always()
        run: |
          if [ ! -f email-test-result.json ]; then
            printf '%s\n' '{"ready":false,"sent":false,"reason":"Workflow did not receive a result"}' > email-test-result.json
          fi
          git config user.name 'Emerald Wellness Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add email-test-result.json
          git commit -m 'Record Emerald email system test result' || exit 0
          git push
